version: '3'
services:
  ranger:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - RANGER_VERSION=${RANGER_VERSION}
        - RANGER_DB_TYPE=${RANGER_DB_TYPE}
        - RANGER_ADMIN_JAVA_VERSION=${RANGER_ADMIN_JAVA_VERSION}
        - USERSYNC_VERSION=${USERSYNC_VERSION}
    image: gohigh/cloudeon/ranger-admin-usersync:2.5.0
    container_name: ranger-cloudeon
    hostname: ranger.example.com
    stdin_open: true
    tty: true
    networks:
      - ranger
    ports:
      - "6080:6080"
    depends_on:
      ranger-zk:
        condition: service_started
      ranger-db:
        condition: service_healthy
      ranger-solr:
        condition: service_started
    environment:
      - RANGER_VERSION
      - RANGER_DB_TYPE
      - USERSYNC_VERSION
      - ENABLE_FILE_SYNC_SOURCE
      - DEBUG_ADMIN=${DEBUG_ADMIN:-false}
    command:
      - /home/ranger/scripts/ranger.sh

  ranger-zk:
    build:
      context: .
      dockerfile: Dockerfile.ranger-zk
      args:
        - ZK_VERSION=${ZK_VERSION}
    image: ranger-zk
    container_name: ranger-zk
    hostname: ranger-zk.example.com
    networks:
      - ranger
    ports:
      - "2181:2181"

  ranger-solr:
    build:
      context: .
      dockerfile: Dockerfile.ranger-solr
      args:
        - SOLR_VERSION=${SOLR_VERSION}
    image: ranger-solr
    container_name: ranger-solr
    hostname: ranger-solr.example.com
    networks:
      - ranger
    ports:
      - "8983:8983"
    command:
      - solr-precreate
      - ranger_audits
      - /opt/solr/server/solr/configsets/ranger_audits/

  ranger-db:
    build:
      context: .
      dockerfile: Dockerfile.ranger-mysql
      args:
        - MARIADB_VERSION=${MARIADB_VERSION}
    image: ranger-mysql
    command: --default-authentication-plugin=mysql_native_password
    container_name: ranger-mysql
    hostname: ranger-db.example.com
    networks:
      - ranger
    healthcheck:
      # Double dollar($$) is required to expand the env variable
      test: "mysql -u root -p$$MYSQL_ROOT_PASSWORD ranger -e 'select 1' > /dev/null"
      interval: 10s
      timeout: 2s
      retries: 30

networks:
  ranger:
    name: rangernw
